        </div>

        <div id="quiz-section" class="card" style="display: none;">

            <div class="options-grid" id="options-container"></div>

    </main>

        let currentGrade = 5;
        let currentUnitIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;

        function showGradeTopics(grade) {
            currentGrade = grade;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-grade${grade}`).classList.add('active');
            document.getElementById('topics-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('picker-section').style.display = 'none';
            document.getElementById('topics-title').innerText = `Grade ${grade} English Units`;
            
            const container = document.getElementById('topics-container');
            container.innerHTML = '';
            quizData[grade].forEach((unit, index) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.onclick = () => startQuiz(index);
                card.innerHTML = `<h3>${unit.unitTitle}</h3><p>${unit.questions.length} Questions</p>`;
                container.appendChild(card);
            });
        }

        function startQuiz(unitIndex) {
            currentUnitIndex = unitIndex;
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('topics-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            loadQuestion();
        }

        function backToTopics() {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('topics-section').style.display = 'block';
        }

        function showPicker() {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-picker').classList.add('active');
            document.getElementById('topics-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('picker-section').style.display = 'block';
            renderStudents();
        }

        function loadQuestion() {
            const unit = quizData[currentGrade][currentUnitIndex];
            const q = unit.questions[currentQuestionIndex];
            document.getElementById('unit-badge').innerText = unit.unitTitle;
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, index === q.correct);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            const options = document.querySelectorAll('.option-btn');
            options.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
            } else {
                btn.classList.add('wrong');
                const correctIdx = quizData[currentGrade][currentUnitIndex].questions[currentQuestionIndex].correct;
                options[correctIdx].classList.add('correct');
            }
        }

        function nextQuestion() {
            const unitQuestions = quizData[currentGrade][currentUnitIndex].questions;
            if (currentQuestionIndex < unitQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                alert(`Quiz Finished! Your Final Score: ${score}`);
                score = 0;
                document.getElementById('score').innerText = score;
                backToTopics();
            }
        }

        /* STUDENT PICKER SYSTEM */
        let students = JSON.parse(localStorage.getItem('smartboard_students')) || ["Alex", "Emma", "John", "Sarah"];

        function saveAndRender() {
            localStorage.setItem('smartboard_students', JSON.stringify(students));
            renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('student-list-container');
            container.innerHTML = '';
            students.forEach((name, index) => {
                const tag = document.createElement('div');
                tag.className = 'student-tag';
                tag.innerHTML = `${name} <span onclick="removeStudent(${index})">✕</span>`;
                container.appendChild(tag);
            });
        }

        function addStudent() {
            const input = document.getElementById('student-name-input');
            const val = input.value.trim();
            if (val) {
                const names = val.split(',').map(n => n.trim()).filter(n => n);
                students.push(...names);
                input.value = '';
                saveAndRender();
            }
        }

        function removeStudent(index) {
            students.splice(index, 1);
            saveAndRender();
        }

        function rollDice() {
            if (students.length === 0) {
                alert("Please add student names first!");
                return;
            }
            const display = document.getElementById('picker-display');
            let count = 0;
            const diceFaces = ['🎲 ⚀', '🎲 ⚁', '🎲 ⚂', '🎲 ⚃', '🎲 ⚄', '🎲 ⚅'];
            
            const timer = setInterval(() => {
                const randomFace = diceFaces[Math.floor(Math.random() * diceFaces.length)];
                const randomStudent = students[Math.floor(Math.random() * students.length)];
                display.innerText = `${randomFace} ${randomStudent}`;
                count++;
                if (count > 12) {
                    clearInterval(timer);
                    const winner = students[Math.floor(Math.random() * students.length)];
                    display.innerText = `🎯 ${winner}`;
                }
            }, 70);
        }

        /* TIMER SYSTEM */
        let timerInterval, seconds = 0, isRunning = false;
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            } else {
                isRunning = true;
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60);
                    let secs = seconds % 60;
                    document.getElementById('timer-display').innerText = 
                        (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            seconds = 0;
            document.getElementById('timer-display').innerText = "00:00";
        }

        showGradeTopics(5);
    </script>
